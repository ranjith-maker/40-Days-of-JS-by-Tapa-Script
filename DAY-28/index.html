<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Country Explorer</title>

    
    <script src="https://cdn.tailwindcss.com"></script>


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>

<body class="bg-gray-900 text-white">

    <div class="mx-auto p-4 max-w-6xl">

        <!-- Header -->
        <div class="flex justify-between items-center gap-4">
            <h1 class="text-3xl font-bold">
                Country Explorer
            </h1>

            <button
                id="showFavBtn"
                class="bg-yellow-500 hover:bg-yellow-600 text-black px-4 py-2 rounded"
            >
                ⭐ Show Favourite Countries
            </button>
        </div>



        <div class="mt-4 flex flex-col sm:flex-row gap-2">

            <input
                id="searchInput"
                type="text"
                placeholder="Enter country name"
                class="border border-gray-400 p-2 rounded w-full sm:w-auto text-black"
            >

            <button
                id="searchBtn"
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded"
            >
                Search
            </button>

         
            <button
                id="addFavBtn"
                class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded"
            >
                ❤️ Add to Fav
            </button>

        </div>



        <div
            id="loader"
            class="hidden mt-4 text-center"
        >
            Loading...
        </div>


  
        <div
            id="error"
            class="hidden mt-4 text-red-500"
        ></div>


        <div
            id="countryDetails"
            class="mt-4 space-y-4"
        ></div>



        <div
            id="map"
            class="h-64 mt-4 rounded"
        ></div>

    </div>



    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <script src="./first.js"></script>

</body>

</html>
