<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 19 </title>
</head>
<body style="background-color: rgb(152, 128, 93);" >
    

<h1> DAY 19 of Learning JS with <u>TS</u> </h1>

<h1 id="heading"  > Welcome to the DAY 19th  </h1>



  <div class="tabs">

    <!-- Tab Headers -->
    <div
      class="tab-headers"
      role="tablist"
      aria-label="Main sections"
    >

      <button
        class="tab active"
        data-tab="1"
        role="tab"
        aria-selected="true"
        aria-controls="content-1"
        id="tab-1"
      >
        Home
      </button>

      <button
        class="tab"
        data-tab="2"
        role="tab"
        aria-selected="false"
        aria-controls="content-2"
        id="tab-2"
      >
        About
      </button>

      <button
        class="tab"
        data-tab="3"
        role="tab"
        aria-selected="false"
        aria-controls="content-3"
        id="tab-3"
      >
        Contact
      </button>

    </div>


    <!-- Tab Contents -->
    <div class="tab-contents">

      <div
        class="content active"
        data-tab="1"
        role="tabpanel"
        id="content-1"
        aria-labelledby="tab-1"
      >
        <h2>Home</h2>
        <p>Welcome to the Home page.</p>
      </div>

      <div
        class="content"
        data-tab="2"
        role="tabpanel"
        id="content-2"
        aria-labelledby="tab-2"
        hidden
      >
        <h2>About</h2>
        <p>Learn more about our company and services.</p>
      </div>

      <div
        class="content"
        data-tab="3"
        role="tabpanel"
        id="content-3"
        aria-labelledby="tab-3"
        hidden
      >
        <h2>Contact</h2>
        <p>Contact us through email or phone.</p>
      </div>

    </div>

  </div>

</body>
</html>
